<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>璐璐宝宝 ❤ 鱿鱼葱 · 我们的情话</title>
<meta name="theme-color" content="#ff6b9a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="我们的纪念日">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff6b9a; --pink-deep:#e75480; --pink-soft:#ffb3c6; --pink-pale:#ffe0ea;
    --text:#5a3d4a; --text-light:#8f6b7a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Noto Sans SC', -apple-system, sans-serif;
    color:var(--text);
    background:linear-gradient(180deg,#fff0f5 0%,#ffe4ec 45%,#ffd6e4 100%);
    min-height:100vh; overflow-x:hidden; position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .heading{font-family:'ZCOOL KuaiLe','Noto Sans SC',sans-serif;}

  /* 漂浮爱心 */
  #hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .heart-float{position:absolute;bottom:-60px;font-size:22px;opacity:0;animation:floatUp linear infinite;}
  @keyframes floatUp{
    0%{transform:translateY(0) rotate(0) scale(1);opacity:0;}
    10%{opacity:.7;} 90%{opacity:.5;}
    100%{transform:translateY(-110vh) rotate(360deg) scale(1.2);opacity:0;}
  }

  /* 飘落鲜花 */
  #flowers{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .flower-fall{position:absolute;top:-60px;font-size:22px;opacity:0;animation:fall linear infinite;}
  @keyframes fall{
    0%{transform:translate3d(0,-5vh,0) rotate(0deg);opacity:0;}
    10%{opacity:.9;} 90%{opacity:.6;}
    100%{transform:translate3d(var(--sway,0),112vh,0) rotate(var(--spin,360deg));opacity:.4;}
  }

  /* 星光闪烁 */
  #stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .star{position:absolute;opacity:0;animation:twinkle 3s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.5);}50%{opacity:.9;transform:scale(1.3);}}

  /* 流星 */
  .shoot{position:fixed;z-index:2;font-size:22px;pointer-events:none;opacity:0;animation:shoot 1.8s ease-out forwards;}
  @keyframes shoot{
    0%{opacity:0;transform:translate(0,0) rotate(0deg);}
    12%{opacity:1;}
    100%{opacity:0;transform:translate(45vw,30vh) rotate(40deg);}
  }

  /* 点击爱心爆炸 */
  .burst{position:fixed;z-index:300;pointer-events:none;transform:translate(-50%,-50%);animation:burst .9s ease-out forwards;}
  @keyframes burst{
    0%{opacity:1;transform:translate(-50%,-50%) scale(.4);}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3);}
  }

  /* 返回 */
  .back{position:fixed;top:20px;left:20px;z-index:10;text-decoration:none;color:var(--pink-deep);
    font-size:15px;font-weight:700;background:#fff;padding:10px 18px;border-radius:999px;
    box-shadow:0 6px 18px rgba(231,84,128,.2);transition:.2s;}
  .back:hover{transform:translateY(-2px);}

  /* 舞台 */
  .stage{position:relative;z-index:1;width:100%;max-width:760px;padding:0 28px;
    text-align:center;cursor:pointer;user-select:none;}
  .stage .icon{font-size:54px;margin-bottom:8px;animation:bounce 2s infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}

  .phrase{min-height:260px;display:flex;align-items:center;justify-content:center;
    font-family:'Noto Sans SC','ZCOOL KuaiLe',sans-serif;
    font-size:clamp(19px,4.2vw,28px);line-height:1.9;color:var(--pink-deep);
    padding:40px 32px;background:#fff;border-radius:32px;
    box-shadow:0 16px 44px rgba(231,84,128,.18);}
  .phrase.show{animation:pop .55s cubic-bezier(.34,1.56,.64,1) forwards;}
  @keyframes pop{
    0%{transform:scale(.3);opacity:0;}
    60%{transform:scale(1.08);opacity:1;}
    100%{transform:scale(1);opacity:1;}
  }

  .hint{margin-top:22px;font-size:15px;color:var(--text-light);letter-spacing:1px;
    animation:blink 1.6s infinite;}
  @keyframes blink{0%,100%{opacity:.35;}50%{opacity:1;}}

  /* 进度点 */
  .progress{margin-top:26px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:520px;margin-left:auto;margin-right:auto;}
  .dot{width:9px;height:9px;border-radius:50%;background:#fff;opacity:.45;transition:.25s;}
  .dot.on{background:var(--pink);opacity:1;transform:scale(1.4);}
  .dot.done{background:var(--pink-soft);opacity:.9;}

  /* 结尾按钮 */
  .end{margin-top:26px;display:none;}
  .end .big{font-size:clamp(40px,9vw,72px);font-family:'ZCOOL KuaiLe',sans-serif;color:var(--pink-deep);}
  .end .btns{margin-top:22px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .btn{display:inline-block;padding:13px 28px;border-radius:999px;text-decoration:none;
    font-size:16px;font-weight:700;transition:.2s;}
  .btn.primary{background:linear-gradient(135deg,#ff6b9a,#ff8fb1);color:#fff;box-shadow:0 10px 26px rgba(231,84,128,.35);}
  .btn.ghost{background:#fff;color:var(--pink-deep);box-shadow:0 6px 18px rgba(231,84,128,.2);}
  .btn:hover{transform:translateY(-2px) scale(1.03);}

  @media(max-width:480px){ .phrase{padding:30px 20px;} }
</style>
</head>
<body>

<div id="hearts"></div>
<div id="flowers"></div>
<div id="stars"></div>
<a class="back" href="index.html">← 返回</a>

<div class="stage" id="stage">
  <div class="icon" id="icon">💕</div>
  <div class="phrase" id="phrase"></div>
  <div class="hint" id="hint">轻点屏幕 · 看下一句 💗</div>
  <div class="progress" id="progress"></div>

  <div class="end" id="end">
    <div class="big">❤ 永远爱你 ❤</div>
    <div class="btns">
      <a class="btn primary" href="javascript:replay()">再看一遍 🔁</a>
      <a class="btn ghost" href="index.html">回到首页 🏠</a>
    </div>
  </div>
</div>

<script>
/* 我们的情话（完整提取自备忘录情书 + 纪念日文件夹里的日常情话） */
const words = [
  "虽然说可能前世有关联的人，第一次碰到，虽然看着宝宝的脸陌生，但心里总有种熟悉的感觉。可以透过宝宝，感受到宝宝心里的善良聪慧。",

  "要说第一次看到最爱的宝宝，是有次晚自习，我记忆犹新。有天晚上看到宝宝悄悄来找洁哥，当时就觉得：嘻嘻，这个女生，说不上来的熟悉感。",

  "还有次我坐在门口，宝宝来给洁哥送东西。在门口看到宝宝脸上透过阳光，满满青春美好的模样，给我留下深深的印象。",

  "毕业撕书那天，宝宝跑来我们班。灯光下的宝宝依旧那样美好，看着漫天散落的书片，我心里悄悄许愿：希望往后宝宝顺利幸福。",

  "后来不知不觉我们就大学啦，从没想到过有天宝宝会来找我。很开心很开心，能和宝宝在一起。",

  "今天也超爱宝宝宝宝 🐻",

  "真的就是看到宝宝，我好开心好开心，心里由衷喜欢爱的人。不管怎么样，我都希望宝宝是个幸福快乐的小女生。",

  "从没敢想过，能和宝宝手牵手在街头游荡，一起坐摩天轮，一起去海洋馆，一起看美丽的建筑，一起吃火锅、吃宝宝配的特别香的酱料。",

  "我好想好想一直和宝宝这样：一起早睡早起，一睁眼就能看见宝宝可爱的脸庞，能给宝宝穿鞋穿袜子，能一起出现在镜头里。",

  "我特别特别喜欢和宝宝一起自拍，然后放大镜头看宝宝，透过脸庞到眼神，直击心灵。对我而言，那是一种特别幸福轻松的感觉。",

  "小游子也一直期盼着，和宝宝好多好多年。逢人我便说：我和最爱的宝宝在一起很多很多年啦。",

  "喜欢是一朝一夕。",

  "或许很多男生的爱好是打游戏或者运动，但小游子一直希望的，就是我的宝宝每天开心，看到你开心的面容。",

  "时常刷到情侣视频，一入神就好几分钟出不来，想象和宝宝一起煮饭，吃完牵手嬉笑走在路上消食，看到有趣的东西拿着互相比划。",

  "璐璐公主九个月快乐鸭～",

  "大家都说害怕异地的相恋，可是宝宝给了我很大很大的勇气。我的宝宝这么好，时常关心我，担心我吃不好给我点东西，还给我做手工。",

  "只要和我的宝宝在一起，不管位置距离，都只是些冰冷的数字罢了，有的是我们彼此灼热的真心真情。",

  "嘿嘿，和璐璐公举的桂林之行完美落幕。",

  "因为我知道，跨过高山，我的宝宝一定会在那里等着我。我们每次见面的各种票据，我都好好收藏着，希望将来展示给我们的朋友看。",

  "新年伊始，又和超爱的璐璐公主宝宝一起。",

  "可能小游子表达得没有网络上的话那么有文采，但每字都是真心真意。",

  "爱你璐璐宝宝，希望明天、后天、三餐、四季，未来都是你。",
];

// 漂浮爱心
(function(){
  const box = document.getElementById('hearts');
  const emojis = ['💗','💕','💖','🩷','💘','🌸'];
  for(let i=0;i<22;i++){
    const s = document.createElement('span');
    s.className = 'heart-float';
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = Math.random()*100 + '%';
    s.style.fontSize = (16 + Math.random()*26) + 'px';
    s.style.animationDuration = (8 + Math.random()*10) + 's';
    s.style.animationDelay = (Math.random()*12) + 's';
    box.appendChild(s);
  }
})();

// 飘落鲜花
(function(){
  const box = document.getElementById('flowers');
  const emojis = ['🌸','🌺','🌹','🌷','🌼','💮','🪻','💐'];
  for(let i=0;i<16;i++){
    const s = document.createElement('span');
    s.className = 'flower-fall';
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = Math.random()*100 + '%';
    s.style.fontSize = (16 + Math.random()*22) + 'px';
    s.style.animationDuration = (9 + Math.random()*8) + 's';
    s.style.animationDelay = (Math.random()*15) + 's';
    s.style.setProperty('--sway', (Math.random()*160-80) + 'px');
    s.style.setProperty('--spin', (Math.random()*720-360) + 'deg');
    box.appendChild(s);
  }
})();

// 星光闪烁
(function(){
  const box = document.getElementById('stars');
  const emojis = ['✨','⭐','🌟','💫'];
  for(let i=0;i<24;i++){
    const s = document.createElement('span');
    s.className = 'star';
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    s.style.fontSize = (8 + Math.random()*12) + 'px';
    s.style.animationDuration = (2 + Math.random()*3) + 's';
    s.style.animationDelay = (Math.random()*4) + 's';
    box.appendChild(s);
  }
})();

// 流星
(function(){
  function star(){
    const s = document.createElement('span');
    s.className = 'shoot';
    s.textContent = '🌠';
    s.style.left = (Math.random()*55) + '%';
    s.style.top = (Math.random()*30) + '%';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 2000);
  }
  setTimeout(star, 2500);
  setInterval(star, 9000);
})();

// 点击爱心爆炸
function spawnBurst(x, y){
  const emojis = ['💗','💕','💖','🩷','💘','✨'];
  for(let i=0;i<10;i++){
    const s = document.createElement('span');
    s.className = 'burst';
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    s.style.fontSize = (12 + Math.random()*14) + 'px';
    const a = Math.random()*Math.PI*2, d = 40 + Math.random()*80;
    s.style.setProperty('--dx', Math.cos(a)*d + 'px');
    s.style.setProperty('--dy', Math.sin(a)*d + 'px');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 950);
  }
}
document.addEventListener('click', e => {
  if(e.target.closest('a, button')) return;
  spawnBurst(e.clientX, e.clientY);
});

// 进度点
const prog = document.getElementById('progress');
words.forEach(()=>{ const d=document.createElement('span'); d.className='dot'; prog.appendChild(d); });
const dots = prog.querySelectorAll('.dot');

const phraseEl = document.getElementById('phrase');
const iconEl = document.getElementById('icon');
const icons = ['💕','🐻','🦑','💗','🌸','💖','🩷','💘','✨','🌙'];
let i = -1;

function showWord(){
  phraseEl.textContent = words[i];
  phraseEl.classList.remove('show');
  void phraseEl.offsetWidth; // 重触发动画
  phraseEl.classList.add('show');
  iconEl.textContent = icons[i % icons.length];
  dots.forEach((d,idx)=>{ d.classList.toggle('on', idx===i); d.classList.toggle('done', idx<i); });
}

function next(){
  i++;
  if(i >= words.length){ end(); return; }
  showWord();
}

function end(){
  phraseEl.classList.remove('show');
  document.getElementById('icon').style.display='none';
  document.getElementById('hint').style.display='none';
  prog.style.display='none';
  document.getElementById('end').style.display='block';
}

function replay(){
  i = -1;
  document.getElementById('icon').style.display='block';
  document.getElementById('hint').style.display='block';
  prog.style.display='flex';
  document.getElementById('end').style.display='none';
  dots.forEach(d=>{ d.classList.remove('on','done'); });
  next();
}

document.getElementById('stage').addEventListener('click', next);
document.addEventListener('keydown', e=>{
  if(e.key===' ' || e.key==='ArrowRight' || e.key==='Enter'){ e.preventDefault(); next(); }
  if(e.key==='ArrowLeft'){ if(i>0){ i-=2; next(); } }
});

next();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
